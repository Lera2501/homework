

<head>
    <title>Gallery</title>
    <link rel="stylesheet" href="../Style.css">
</head>
<style>
        body {
            background-color: #f5ede3;
            color: #514438;
            font-family: 'Montserrat', sans-serif;
            font-size: 17px;
            line-height: 1.9;
            margin: 0;
            padding: 30px 20px;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            color: #795c46;
            font-size: 42px;
            font-weight: 500;
            text-align: center;
            margin: 30px auto;
        }

        p {
            max-width: 850px;
            margin: 30px auto;
            padding: 25px;
            background-color: #fffaf4;
            border-radius: 14px;
            box-shadow: 0 5px 20px rgba(90, 65, 40, 0.06);
            text-align: justify;
        }

        img {
            display: block;
            max-width: 100%;
            height: auto;
            margin: 35px auto;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(90, 65, 40, 0.15);
            transition: transform 0.3s ease;
        }

        img:hover {
            transform: scale(1.02);
        }

        @media (max-width: 600px) {
            body {
                padding: 20px 15px;
                font-size: 15px;
            }

            h1 {
                font-size: 32px;
            }

            p {
                padding: 18px;
                text-align: left;
            }
        }
    </style>
    </body>

    </body>

</html>
